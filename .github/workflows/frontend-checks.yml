name: Frontend Lint and Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

defaults:
  run:
    working-directory: frontend

jobs:
  lint-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This job always runs so `lint-build` can be a required status check
      # without deadlocking PRs that don't touch the frontend. When no frontend
      # files changed, the heavy steps below are skipped and the job reports
      # success — so runner time stays low while the gate stays enforced.
      - name: Detect frontend changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-checks.yml'

      - name: Set up Node
        if: github.event_name == 'push' || steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: github.event_name == 'push' || steps.filter.outputs.frontend == 'true'
        run: npm ci

      - name: Run eslint
        if: github.event_name == 'push' || steps.filter.outputs.frontend == 'true'
        run: npm run lint

      - name: Type check and build
        if: github.event_name == 'push' || steps.filter.outputs.frontend == 'true'
        run: npm run build

      - name: Install Chromium
        if: github.event_name == 'push' || steps.filter.outputs.frontend == 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Browser regression checks
        if: github.event_name == 'push' || steps.filter.outputs.frontend == 'true'
        run: |
          nohup npx vite preview --port 4173 > ../preview.log 2>&1 &
          timeout 30 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:4173/; do sleep 1; done'
          npm run test:ui -- http://127.0.0.1:4173
